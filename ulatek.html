<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ula'tek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="boss.css">
</head>
<body>
<div class="wrap" id="wrap"></div>
<script src="shared.js"></script>
<script>
// The page is drawn by boss.js from this config (see the top of boss.js for what each part means).
const contacts = (p, ability, gap = 2) => { const last = {}, out = [];
  hitsOf(p, ability).forEach(h => { if (last[h[1]] == null || h[0] - last[h[1]] > gap) out.push(h); last[h[1]] = h[0]; }); return out; };
const EGG = ['Malignant Shell', 'Noxious Shell'];
const carrying = (p, n, t) => EGG.some(e => hadAura(p, n, e, t, 0.2));
// a Blightscale Viper hatching sprays Putrid Membrane on everyone: the egg touched venom (a wave, the water) instead of a Spectral Coil
const vipers = p => pulsesOf(p, 'aura:Putrid Membrane').map(x => ({t: x[0],
  eggs: [...new Set(EGG.flatMap(e => auras(p, e)).filter(a => a[2] != null && a[2] > x[0] - 3 && a[2] <= x[0] + 0.3).map(a => a[0]))],
  wave: [...new Set(hitsOf(p, 'Caustic Waves').filter(h => h[0] > x[0] - 3 && h[0] <= x[0] + 0.3 && carrying(p, h[1], h[0] - 0.1)).map(h => h[1]))]}));
const waveHits = p => contacts(p, 'Caustic Waves', 3);
// Spectral Coils: everyone who mitigated one gets Soul Constrictor (Heroic+); one already constricted can't help the next
const coils = p => pulsesOf(p, 'aura:Soul Constrictor').map(x => ({t: x[0], soak: x[1]}));
const tankFails = p => [...pulsesOf(p, 'Rattler Slam').map(x => [x[0], 'Tail not tanked', 'Rattler Slam hit the raid']),
  ...pulsesOf(p, 'Unchecked Rage').map(x => [x[0], "Ula'tek not in melee", 'Unchecked Rage hit the raid']),
  ...pulsesOf(p, '#1301122').map(x => [x[0], "Tank out of reach", "Mother's Wrath hit the raid"])].sort((a, b) => a[0] - b[0]);
// Grasping Fangs: snap two, wait for Blight Vein (on the whole raid) to fall off, then the next two
const snaps = p => auras(p, 'Grasping Fangs').filter(a => a[2] != null).map(a => ({n: a[0], t: a[2],   // the pair snapped together (3 s) is fine
  early: auras(p, 'Blight Vein').some(b => b[1] < a[2] - 3 && (b[2] == null || b[2] > a[2]))}));
const bites = p => auras(p, "Serpent's Bite").map(a => ({n: a[0], t: a[1], s: (a[2] != null ? a[2] : p.dur) - a[1],
  stone: auras(p, 'Calcified Corpse').some(c => c[0] === a[0] && a[2] != null && Math.abs(c[1] - a[2]) < 1.5)}));
const purgeHits = p => hitsOf(p, 'Volatile Purge splash').filter(h => !hadAura(p, h[1], 'Volatile Purge', h[0], 1));
const CFG = {
  slug: 'ulatek', name: "Ula'tek", enc: ['3492'],
  map: {src: 'img/maps/ulatek.webp', cal: {cx: 1556.1, cy: 0.4, ppy: 6.507, rot: 0, center: [299.5, 287.1]}},
  hitNames: {'#1305878': 'Volatile Purge splash', '#1304270': 'Falling spawn'},
  modules: [
    {id: 'egg', title: 'Eggs and vipers',
     one: p => ({head: ['Time', ['What', 'l'], ['Who', 'l']], rows: vipers(p).map(v => [T(v.t), B('Viper hatched'),
       X(v.wave.length ? `${v.wave.map(pname).join(', ')} hit by a wave carrying an egg` : v.eggs.length ? `eggs that hatched then: ${v.eggs.map(pname).join(', ')}` : 'an egg on the ground', 'det')])}),
     all: list => perPlayer(list, [{h: 'Hit by a wave carrying an egg', get: p => vipers(p).flatMap(v => v.wave.map(n => ({n, t: v.t})))},
       {h: 'Egg hatched as a viper', cls: 'meh', get: p => vipers(p).filter(v => !v.wave.length).flatMap(v => v.eggs.map(n => ({n, t: v.t})))}]),
     foot: list => { const v = list.reduce((a, p) => a + vipers(p).length, 0); return v ? `<b style="color:var(--crit)">${v} viper${v === 1 ? '' : 's'} hatched (Putrid Membrane on the raid each).</b>` : ''; },
     note: 'Carry eggs into a Spectral Coil to hatch a harmless Rawling. An egg touched by a Caustic Wave or the water hatches a Blightscale Viper. "Eggs that hatched then" is a guess when no carrier was hit by a wave.'},

    {id: 'wave', title: 'Caustic Waves',
     one: p => perPlayer([p], [{h: 'Hit', get: q => waveHits(q).map(h => ({n: h[1], t: h[0]}))}]),
     all: list => perPlayer(list, [{h: 'Hit', get: q => waveHits(q).map(h => ({n: h[1], t: h[0]}))}]),
     note: 'Watch which wing she pulls back and run to the safe side; the next set comes from the other side. In Phase 3 the waves have gaps.',
     overlay: {label: 'Caustic Waves', get: p => waveHits(p).map(h => ({pos: h[4], n: h[1], t: h[0], tip: `<b style="color:${color(h[1])}">${esc(h[1])}</b> hit by a Caustic Wave${carrying(p, h[1], h[0]) ? ' (carrying an egg)' : ''}`})),
       key: () => `<span>${KEY_DOT}Hit by a wave (player colour)</span>`}},

    {id: 'coil', title: 'Spectral Coils', diffs: '15,16',
     one: p => ({head: ['Time', 'Soakers'], rows: coils(p).filter(c => c.soak.length < 6).map(c => [T(c.t), N(c.soak.length)])}),
     all: list => ({head: [['Pulls', 'l'], 'Coils', 'Soaked by fewer than 6'], rows: [[`<td class="l">${list.length}</td>`, V(list.reduce((a, p) => a + coils(p).length, 0)),
       N(list.reduce((a, p) => a + coils(p).filter(c => c.soak.length < 6).length, 0))]]}),
     note: 'Listed when fewer than 6 soaked. Two groups take turns soaking (each player soaking gets Soul Constrictor and can\'t help with the next one). Damage drops with every player in it.'},

    {id: 'tank', title: 'Tank and tail',
     one: p => ({head: ['Time', ['What', 'l'], ['Details', 'l']], rows: tankFails(p).map(x => [T(x[0]), B(x[1]), X(x[2], 'det')])}),
     all: list => ({head: [['What', 'l'], 'Times', 'Pulls with it'], rows: ['Tail not tanked', "Ula'tek not in melee", 'Tank out of reach'].map(w => {
       const per = list.map(p => tankFails(p).filter(x => x[1] === w).length); return [`<td class="l">${esc(w)}</td>`, N(per.reduce((a, b) => a + b, 0)), V(per.filter(Boolean).length)]; })}),
     note: "Someone always in reach of the tail (Gore Rattle) and of Ula'tek; after Mother's Wrath knocks the tank back they run straight back into the pool in front of her."},

    {id: 'fang', title: 'Grasping Fangs',
     one: p => ({head: ['Time', ['Snapped too early', 'l']], rows: snaps(p).filter(s => s.early).map(s => [T(s.t), P(s.n)])}),
     all: list => perPlayer(list, [{h: 'Snapped too early', get: p => snaps(p).filter(s => s.early).map(s => ({n: s.n, t: s.t}))}]),
     foot: list => { const m = Math.max(0, ...list.flatMap(p => auras(p, 'Blight Vein').map(a => a[3]))); return m > 1 ? `Blight Vein reached ${m} stacks on the raid.` : ''; },
     note: 'Each snapped fang puts Blight Vein on the whole raid (Heroic+, both platforms). Snap two, wait for it to fall off, then the next two.'},

    {id: 'kick', title: 'Kicks', one: p => kickOne(p, ['Malice', 'Anguished Cry', 'Vicious Echoes']), all: list => kickAll(list, ['Malice', 'Anguished Cry', 'Vicious Echoes']),
     foot: list => { const r = list.reduce((a, p) => a + pulsesOf(p, 'Dread Roar').length, 0); return kickFoot(list, ['Malice', 'Anguished Cry', 'Vicious Echoes']) + (r ? ` <b style="color:var(--crit)">Dread Roar ${r}×: a Ravenous Doomscale hatched unweakened.</b>` : ''); },
     note: 'Malice (Doomscale Warden), Anguished Cry (Weakened Doomscale), Vicious Echoes (Blightscale Shrieker).'},

    {id: 'bite', title: "Serpent's Bite",
     one: p => ({head: ['Time', ['What', 'l'], ['Who', 'l']], rows: [...bites(p).filter(b => b.stone).map(b => ({t: b.t + b.s, r: [T(b.t + b.s), B('Turned to stone'), P(b.n)]})),
       ...dedupe(purgeHits(p), 2).map(h0 => ({t: h0[0], r: [T(h0[0]), B('Hit by a Volatile Purge'), PS([...new Set(purgeHits(p).filter(h => Math.abs(h[0] - h0[0]) < 2).map(h => h[1]))])]}))].sort((a, b) => a.t - b.t).map(x => x.r)}),
     all: list => perPlayer(list, [{h: 'Turned to stone', get: p => bites(p).filter(b => b.stone).map(b => ({n: b.n, t: b.t}))},
       {h: 'Hit by a Volatile Purge', get: p => purgeHits(p).map(h => ({n: h[1], t: h[0]}))}]),
     note: "Each bite (one melee, one healer, one ranged) has to be soaked by its group until it's gone, or the player becomes a Calcified Corpse (a wipe). Soakers then spread before Volatile Purge goes off.",
     overlay: {label: 'Turned to stone', get: p => auras(p, 'Calcified Corpse').map(a => ({pos: a[5], t: a[1], mark: 'cross', tip: `<b style="color:${color(a[0])}">${esc(a[0])}</b> turned to stone`})),
       key: () => `<span>${keyCross('#ff5a4a')}Calcified Corpse</span>`}},
  ],
  avoid: {names: ['Caustic Waves', 'Falling Debris', 'Virulent Spit', 'Falling spawn', 'Volatile Purge splash', 'Desperate Thrash', 'Deadly Venom'],
    short: {'Caustic Waves': 'Waves', 'Falling Debris': 'Debris', 'Virulent Spit': 'Spit', 'Falling spawn': 'Spawn', 'Volatile Purge splash': 'Purge', 'Desperate Thrash': 'Thrash', 'Deadly Venom': 'Venom'},
    skip: (h, p) => (h[2] === 'Desperate Thrash' && isTankIn(p, h[1])) || (h[2] === 'Volatile Purge splash' && hadAura(p, h[1], 'Volatile Purge', h[0], 1)),
    note: "Damage taken from each (hover a number for how many hits; shields count). Falling spawn: under a Blightscale spawning from Call of the Serpent. Volatile Purge splash doesn't count on the player purging; Desperate Thrash doesn't count on tanks."},
  abilities: {'Putrid Membrane': 1301268, 'Blightscale Viper': 1301268, 'Spectral Coil': 1287265, 'Spectral Coils': 1287265, 'Soul Constrictor': 1300685,
    'Rattler Slam': 1299206, 'Unchecked Rage': 1286945, "Mother's Wrath": 1298367, 'Dread Roar': 1305775, 'Malice': 1290779, 'Anguished Cry': 1305650,
    'Vicious Echoes': 1310764, "Serpent's Bite": 1295905, 'Calcified Corpse': 1306119, 'Caustic Waves': 1292403, 'Caustic Wave': 1292403, 'Falling Debris': 1286885,
    'Virulent Spit': 1302982, 'Volatile Purge': 1306086, 'Desperate Thrash': 1305709, 'Grasping Fangs': 1301117, 'Blight Vein': 1311609, 'Deadly Venom': 1297338},
  how: "Built from the Encounter Journal, Method's Heroic and Mythic guides and Icy Veins, and checked against Taylor's logs (Aug-Oct 2026: 41 Heroic pulls; no Mythic pulls seen yet); not yet checked on a live raid night. Spectral Coil soakers are the players who got Soul Constrictor. The room image is from raidstrats.gg, lined up on the platform and the walkways to the side landings (north up).",
};
</script>
<script src="boss.js"></script>
</body>
</html>
