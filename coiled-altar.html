<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Coiled Altar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">

</head>
<body>
<div class="wrap" id="wrap"></div>
<script src="shared.js"></script>
<script>
// The page is drawn by boss.js from this config (see the top of boss.js for what each part means).
// Reworked 2026-11-11 for Mythic (Taylor): Orbs, Guillotines, Ghosts and Dreadmarch overlays, each with a button per set under it.
// Spell data (wago.tools, game build 12.1.7): Sever 1299684 = 60-degree cone, 35 yd; Blighted Sever 1307292 and Soul Sever 1286620 =
// 60 degrees, 45 yd. Guillotine 1283594 / Grim Guillotine 1299296 split among players within 9 yd (Mythic: at least 5 players).
// Volatile Venom 1282419 (green carrier) hurts players within 5 yd; Mutagenic Venom 1310498 (purple carrier, Mythic) within 6 yd (hotfix Oct 13, 2026: was 8) and
// explodes nearby globules (20 Venom Ruptures each). Mythic ghosts refixate every 15 s (1309403); two touching = Malevolent Resonance.
const contacts = (p, ability, gap = 2) => { const last = {}, out = [];
  hitsOf(p, ability).forEach(h => { if (last[h[1]] == null || h[0] - last[h[1]] > gap) out.push(h); last[h[1]] = h[0]; }); return out; };
const severs = p => ['Sever', 'Soul Sever', 'Blighted Sever'].flatMap(s => contacts(p, s, 8).filter(h => !isTankIn(p, h[1])).map(h => ({t: h[0], n: h[1], s})));   // the DoT ticks count once
const fangs = p => auras(p, 'Venomfang').map(a => ({n: a[0], t: a[1], s: (a[2] != null ? a[2] : p.dur) - a[1],
  by: (p.dispels.find(d => d[2] === a[0] && d[3] === 'Venomfang' && Math.abs(d[0] - (a[2] || 0)) < 0.4) || [])[1] || null}));
const clipped = p => hitsOf(p, 'Gloombomb').filter(h => !hadAura(p, h[1], 'Gloombomb', h[0], 1));
const initial = n => n ? [...n][0].toUpperCase() : '';
const nameTip = n => `<b style="color:${color(n)}">${esc(n)}</b>`;
const setsOf = (list, fn, label) => { const ks = new Set(); list.forEach(p => fn(p).forEach(k => ks.add(k)));
  return [...ks].sort((a, b) => a - b).map(k => ({k, label: label(k)})); };
const trailOf = (p, aura, n, on) => ((p.trails || {})[aura] || []).find(r => r[0] === n && Math.abs(r[1] - on) < 0.5);
const posFromTrail = (tr, t) => { if (!tr || !tr[3].length) return null; let b = tr[3][0]; tr[3].forEach(q => { if (Math.abs(q[0] - t) < Math.abs(b[0] - t)) b = q; }); return Math.abs(b[0] - t) < 2 ? [b[1], b[2]] : null; };

// ======== Orbs: Coalesced Venom (green) and Virulent Mutation (purple, Mythic) ========
// p.orbs [seen, kind, unit id, x, y, gone]: every globule where it appeared (from 2026-11-11 on; older nights: p.drops, green only).
// A set = the orbs and frontals from one Toxic Deluge to the next. Carriers: Volatile Venom (green) / Mutagenic Venom (purple):
// picking one up = the nearest globule of that colour to where they stood; it drops where the debuff ends. A frontal (Sever /
// Blighted Sever) destroys the globules in its cone, one Venom Rupture stack each (p.stackev: the exact count the log shows).
// Explosion: a purple globule touching another globule, or a purple carrier walking into one.
const ORB = {cv: {label: 'Green orb', name: 'Coalesced Venom', color: '#7fd36b', r: 3, carrier: 'Volatile Venom', cr: 5, pick: 'green'},
             vm: {label: 'Purple orb', name: 'Virulent Mutation', color: '#c77dff', r: 6, carrier: 'Mutagenic Venom', cr: 6, pick: 'purple'}};   // 6 yd since the Oct 13 hotfix (was 8)
const FRONTAL = {'Sever': {len: 35, deg: 60}, 'Blighted Sever': {len: 45, deg: 60}, 'Soul Sever': {len: 45, deg: 60}};
const FRONT_MAX = {cv: 3, vm: 2};   // a frontal hitting more than this many green / purple orbs is red
const PICKERS = {'Shènròn': 'green', 'Roychi': 'green', 'Zynzii': 'green', 'Snakespeare': 'green', 'Skwup': 'green', 'Kiirelan': 'green',
  'Daragnos': 'green', 'Monostereo': 'green', 'Integralgrip': 'purple', 'Phurry': 'purple', 'Spellrift': 'purple', 'Aktapewpew': 'purple'};
const pickersFor = p => groupsAt(GROUPS.pickers, pullUtc(p), p.diff) || PICKERS;
// the green / purple lists are the Mythic plan: other difficulties aren't judged
const mayPick = (p, n, kind) => { if (p.diff !== 16) return true; const v = pickersFor(p)[n]; return v === ORB[kind].pick || v === 'both'; };
const angDiff = (a, b) => Math.abs(((a - b + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
// where a frontal pointed: from the caster to the players it hit (the tank), else the caster's logged facing
function frontalOf(p, c){
  const [t, name, x, y, f] = c, hit = hitsOf(p, name).filter(h => Math.abs(h[0] - t) < 0.6 && h[4]);
  const dir = hit.length ? Math.atan2(hit.reduce((a, h) => a + h[4][1], 0) / hit.length - y, hit.reduce((a, h) => a + h[4][0], 0) / hit.length - x) : f;
  const jump = (p.stackev || []).find(s => s[1] === 'Venom Rupture' && Math.abs(s[0] - t) < 0.4);
  return Object.assign({t, name, pos: [x, y], dir, log: jump ? jump[2] : 0, tanks: [...new Set(hit.map(h => h[1]))]}, FRONTAL[name]);
}
function orbSim(p){
  if (p._orb) return p._orb;
  const deluges = castsOf(p, 'Toxic Deluge'), setAt = t => orbSetAt(p, t);
  let orbs = (p.orbs || []).map(o => ({t: o[0], kind: o[1], id: o[2], pos: [o[3], o[4]]}));
  if (!p.orbs) orbs = (p.drops || []).filter(d => d[1] === 'Coalesced Venom').map(d => ({t: d[0], kind: 'cv', pos: d[2]}));
  if (!p.orbs && !p.drops) orbs = auras(p, 'Volatile Venom').filter(a => a[2] != null && a[6]).map(a => ({t: a[2], kind: 'cv', pos: a[6]}));   // oldest nights
  orbs.forEach(o => { o.set = setAt(o.t); });
  const carriers = Object.keys(ORB).flatMap(kind => auras(p, ORB[kind].carrier).map(a => ({kind, n: a[0], on: a[1], off: a[2], pos0: a[5], pos1: a[6]})));
  carriers.forEach(c => { if (c.off == null) return;   // the globule a carrier dropped: one that appeared when their debuff ended
    const o = orbs.filter(o => !o.by && Math.abs(o.t - c.off) < 0.35).sort((a, b) => Math.abs(a.t - c.off) - Math.abs(b.t - c.off))[0];
    if (o){ o.by = c.n; o.carried = c.kind; o.ok = mayPick(p, c.n, c.kind); } });
  const ev = [...orbs.map(o => ({t: o.t, k: 'orb', o})), ...carriers.map(c => ({t: c.on, k: 'pick', c})),
    ...(p.cones || []).filter(c => c[1] !== 'Soul Sever').map(c => ({t: c[0], k: 'cone', c})),
    ...(p.stackev || []).filter(s => s[1] === 'Venom Rupture' && !(p.cones || []).some(c => Math.abs(c[0] - s[0]) < 0.4)).map(s => ({t: s[0], k: 'jump', s}))]
    .sort((a, b) => a.t - b.t || (a.k === 'orb' ? -1 : 1));
  const alive = [], gone = (o, t, how) => { o.gone = t; o.how = how; alive.splice(alive.indexOf(o), 1); };
  const frontals = [], booms = [];
  const boom = (t, pos, os, names, why) => { booms.push({t, pos, names: [...new Set(names.filter(Boolean))], why, set: setAt(t)}); os.forEach(o => alive.includes(o) && gone(o, t, 'exploded')); };
  ev.forEach(e => {
    if (e.k === 'orb'){ const o = e.o;
      const touch = alive.filter(a => (a.kind === 'vm' || o.kind === 'vm') && dist(a.pos, o.pos) < ORB[a.kind].r + ORB[o.kind].r);
      alive.push(o);
      if (touch.length) boom(o.t, o.pos, [o, ...touch], [o.by, ...touch.map(a => a.by)], 'touched');
    } else if (e.k === 'pick'){ const c = e.c;
      if (!c.pos0) return;
      const o = alive.filter(a => a.kind === c.kind && dist(a.pos, c.pos0) < ORB[c.kind].r + 4).sort((a, b) => dist(a.pos, c.pos0) - dist(b.pos, c.pos0))[0];
      if (o){ o.pickedBy = c.n; gone(o, c.on, 'picked up'); }
      if (c.kind === 'vm'){   // a purple carrier walking within 6 yd of a globule explodes it
        const tr = trailOf(p, ORB.vm.carrier, c.n, c.on);
        (tr ? tr[3] : []).forEach(q => { const hit = alive.filter(a => a !== o && a.t < q[0] && dist(a.pos, [q[1], q[2]]) < ORB.vm.cr + ORB[a.kind].r);
          if (hit.length) boom(q[0], hit[0].pos, hit, [c.n], 'carrier'); });
      }
    } else if (e.k === 'cone'){ const F = frontalOf(p, e.c); F.set = setAt(F.t);
      const inCone = alive.filter(a => dist(a.pos, F.pos) <= F.len + ORB[a.kind].r && angDiff(Math.atan2(a.pos[1] - F.pos[1], a.pos[0] - F.pos[0]), F.dir) <= F.deg * Math.PI / 360);
      F.hits = {cv: inCone.filter(a => a.kind === 'cv').length, vm: inCone.filter(a => a.kind === 'vm').length};
      if (F.log && F.log < F.hits.cv + F.hits.vm) F.hits.cv = Math.max(0, Math.min(F.hits.cv, F.log - F.hits.vm));   // the log's count wins
      F.bad = F.hits.cv > FRONT_MAX.cv || F.hits.vm > FRONT_MAX.vm;
      inCone.forEach(a => { a.frontal = F; gone(a, F.t, 'destroyed by ' + F.name); }); frontals.push(F);
    } else if (e.k === 'jump'){   // stacks gained with no frontal: 15+ at once = an explosion; fewer = the globules left when Zul'jan fell
      if (e.s[2] >= 15){ if (!booms.some(b => Math.abs(b.t - e.t) < 1.5)) booms.push({t: e.t, pos: null, names: [], why: 'log', set: setAt(e.t), log: e.s[2]});
        else booms.filter(b => Math.abs(b.t - e.t) < 1.5).forEach(b => { b.log = e.s[2]; }); }
      else alive.slice().forEach(a => gone(a, e.t, 'popped when the phase ended'));
    }
  });
  return (p._orb = {orbs, frontals, booms});
}
// a set's key = phase * 10 + its number in that phase (P1 set 2 = 12, P3 set 1 = 31): P3 starts with Soulbinding (the intermission)
function orbSetAt(p, t){
  const soul = castsOf(p, 'Soulbinding')[0], p3 = soul != null && t >= soul, ds = castsOf(p, 'Toxic Deluge').filter(d => p3 ? d >= soul : soul == null || d < soul);
  return (p3 ? 30 : 10) + Math.max(1, ds.filter(d => d <= t + 0.5).length);
}
// set 10 = "P1": where the P1 spots are placed before any pull (every P1 set shares them); 31, 32... = P3 sets, each its own spots
const orbSetLabel = k => k === 10 ? 'P1' : `P${Math.floor(k / 10)} set ${k % 10}`;
// P3 sets that have spots: saved ones, plus the unsaved ones while an admin edits
const spotP3Sets = () => [...new Set([...Object.keys(spotsNow(16)), ...Object.keys(editingSpots() ? SPOTS.draft : {})].map(k => (k.match(/^s(3\d):/) || [])[1]).filter(Boolean).map(Number))];
const orbSets = p => { const S = orbSim(p); return [...new Set([...S.orbs.map(o => o.set), ...S.frontals.map(f => f.set)])]; };
const fate = o => o.how ? `<br>${esc(o.how)}${o.pickedBy ? ' by ' + nameTip(o.pickedBy) : ''} at ${mss(o.gone)}` : '';
function orbMarks(p, set){
  const S = orbSim(p), out = [];
  S.frontals.filter(F => F.set === set).forEach(F => out.push({mark: 'cone', pos: F.pos, dir: F.dir, len: F.len, deg: F.deg, t: F.t, color: F.bad ? '#ff5a4a' : '#d8d2cf',
    tip: `<b>${esc(F.name)}</b>${F.tanks.length ? ' on ' + F.tanks.map(nameTip).join(', ') : ''}<br>Hit ${F.hits.cv} green, ${F.hits.vm} purple${F.log ? ` (the log: ${F.log} destroyed)` : ''}`}));
  S.orbs.filter(o => o.set === set).forEach(o => { const K = ORB[o.kind];
    out.push({mark: 'orb', kind: o.kind, dropped: !!o.by, pos: o.pos, r: K.r, color: K.color, letter: initial(o.by), lc: o.by ? (o.ok ? color(o.by) : '#ff5a4a') : null, t: o.t,
      tip: o.by ? `${nameTip(o.by)} dropped a ${K.label.toLowerCase()} here${o.ok ? '' : ` <b style="color:var(--crit)">(not on the ${ORB[o.carried].pick} list)</b>`}${fate(o)}`
                : `${K.label} from Toxic Deluge${fate(o)}`}); });
  S.booms.filter(b => b.set === set && b.pos).forEach(b => out.push({mark: 'cross', pos: b.pos, t: b.t, color: '#ff5a4a',
    tip: `<b>Orbs exploded</b>${b.names.length ? '<br>' + b.names.map(nameTip).join(', ') : ''}${b.log ? `<br>the log: ${b.log} Venom Rupture stacks` : ''}`}));
  return out;
}
// what went wrong with the orbs in one pull: [{t, set, what, who: [names], cls}]
function orbFails(p){
  const S = orbSim(p), out = [];
  S.frontals.filter(F => F.bad).forEach(F => out.push({t: F.t, set: F.set, what: `${F.name} hit ${F.hits.cv} green, ${F.hits.vm} purple`, who: F.tanks}));
  S.orbs.filter(o => o.by && !o.ok).forEach(o => out.push({t: o.t, set: o.set, what: `Carried a ${ORB[o.carried].pick} orb (not on the list)`, who: [o.by]}));
  S.booms.forEach(b => out.push({t: b.t, set: b.set, what: b.pos ? 'Orbs exploded' : `Orbs exploded (${b.log} Venom Rupture stacks)`, who: b.names}));
  return out.sort((a, b) => a.t - b.t);
}

// ======== Guillotines: P1 soaks 1-2 (Guillotine), P3 soaks 1-3 (Grim Guillotine) ========
// the soak groups (Taylor 2026-11-11); the target is on the axe and doesn't count as missing
const G1 = ['Calexanich', 'Daragnos', 'Kiirelan', 'Monostereo', 'Yuña', 'Sighhigh', 'Sueldh', 'Waynegry'];   // the NSRT note, 2026-11-11
const G2 = ['Aktapewpew', 'Spellrift', 'Jeckw', 'Tayluor', 'Skwup', 'Roychi', 'Zynzii', 'Shènròn'];
const GUIL = {'Guillotine': {phase: 'P1', groups: [G1, G2], target: '#1283485', hit: 'Guillotine soak', snap: '#1283594'},
              'Grim Guillotine': {phase: 'P3', groups: [G1, G2, G2], target: '#1299266', hit: 'Grim Guillotine soak', snap: '#1299296'}};
const GUIL_R = 9;
// the Mythic plan: each soak's key (as guillotines() numbers them), label and group
const G3 = ['Aktapewpew', 'Jeckw', 'Skwup', 'Spellrift', 'Tayluor', 'Integralgrip', 'Phurry', 'Snakespeare'];
const GUIL_DEF = [[11, 'P1 soak 1', G1], [12, 'P1 soak 2', G2], [31, 'P3 soak 1', G1], [32, 'P3 soak 2', G2], [33, 'P3 soak 3', G3]].map(([key, label, group]) => ({key, label, group}));
// the groups in force: saved ones (Edit soak groups, or the uploader reading the NSRT note) for that moment, else the defaults
const soakGroups = (utcMs, diff) => { const g = groupsAt(GROUPS.soaks, utcMs, diff) || {}; return GUIL_DEF.map(P0 => Object.assign({}, P0, {group: g[P0.key] || P0.group})); };
const GUIL_PLAN_NOW = () => soakGroups(Date.now(), 16);
const GUIL_TXT = {target: 'Targeted', soaked: 'Soaked', extra: 'Soaked (not in this group)', missed: 'Missed the soak', dead: 'Dead before it landed', absent: 'Not in the raid'};
const GUIL_CLS = {target: '', soaked: 'good', extra: 'bad', missed: 'bad', dead: 'dim', absent: 'dim'};
function guillotines(p){
  if (p._guil) return p._guil;
  const out = [];
  Object.entries(GUIL).forEach(([cast, G]) => castsOf(p, cast).forEach((c, i) => {
    const key = (G.phase === 'P1' ? 10 : 30) + i + 1, tgt = auras(p, G.target).find(a => Math.abs(a[1] - c) < 1.5);
    const snap = (p.snaps || []).find(s => s[1] === G.snap && s[0] >= c && s[0] - c < 10);
    const land = snap ? snap[0] : tgt && tgt[2] != null ? tgt[2] : c + 5;
    const hit = [...new Set(hitsOf(p, G.hit).filter(h => Math.abs(h[0] - land) < 2).map(h => h[1]))];
    // the soak groups are the Mythic plan; other difficulties show who soaked, nobody "missed"
    const planned = p.diff === 16 ? (soakGroups(pullUtc(p), p.diff).find(x => x.key === key) || {}).group : null;
    const group = p.diff === 16 ? planned || G.groups[i] || [] : hit, target = tgt ? tgt[0] : null;
    const dead = n => p.deaths.some(d => d[1] === n && d[0] < land);
    const missed = p.diff !== 16 ? [] : group.filter(n => n !== target && !hit.includes(n) && !dead(n) && (p.specs ? p.specs[n] != null : true));
    const sp = snap ? snap[2] : {}, tpos = (snap && target && sp[target]) || (tgt && tgt[6]) || null;
    // one row per soaker of this soak only (Taylor: "just have rows for each soaking player"): Mythic = the soak's group members
    // in the raid (not the target, who is in the heading); other difficulties = whoever the axe hit
    const status = n => hit.includes(n) ? 'soaked' : dead(n) ? 'dead' : p.specs && p.specs[n] == null ? 'absent' : 'missed';
    // Mythic: anyone the axe hit who isn't in this soak's group and isn't the target is added after the group (Taylor 2026-11-11)
    const players = [...group.filter(n => n !== target).map(n => ({n, s: status(n)})),
      ...(p.diff === 16 ? hit.filter(n => n !== target && !group.includes(n)).map(n => ({n, s: 'extra'})) : [])]
      .map(x => Object.assign(x, {d: tpos && sp[x.n] ? dist(sp[x.n], tpos) : null}));
    out.push({key, label: `${G.phase} soak ${i + 1}`, cast, t: land, target, hit, group, missed, snap: sp, tpos, players});
  }));
  return (p._guil = out.sort((a, b) => a.t - b.t));
}
function guilMarks(p, key){
  const g = guillotines(p).find(x => x.key === key); if (!g) return [];
  const out = [];
  if (g.tpos) out.push({mark: 'ring', pos: g.tpos, r: GUIL_R, color: '#d8d2cf'});
  g.group.filter(n => n !== g.target).forEach(n => { const q = g.snap[n]; if (!q) return; const miss = g.missed.includes(n);
    if (miss) out.push({mark: 'hollow', pos: q, color: '#ff5a4a'});
    out.push({pos: q, n, t: g.t, color: color(n), tip: `${nameTip(n)}${miss ? ' <b style="color:var(--crit)">missed the soak</b>' : ' soaked'}`}); });
  if (g.tpos) out.push({mark: 'diamond', pos: g.tpos, t: g.t, color: '#ffffff', tip: `${g.target ? nameTip(g.target) : 'Target'}: targeted by ${esc(g.cast)}<br>${g.hit.length} soaked`});
  return out;
}

// admin: Edit soak groups (under the Guillotine table): one line of names per soak; Save counts for Mythic pulls from now on
function soakEditor(el){
  if (!isEditor()){ el.innerHTML = ''; return; }
  const d0 = el.querySelector('details.grped'); if (d0 && d0.open) return;   // leave it alone while it's being edited
  const plan = GUIL_PLAN_NOW(), mine = (GROUPS.soaks || []).filter(c => !c.diffs || c.diffs.includes(16));
  const fmt = c => new Date(c.at * 1000).toLocaleString(undefined, {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  el.innerHTML = `<details class="grped"><summary>Edit soak groups</summary>
    <p class="sphelp">Mythic. Names separated by spaces; they count for pulls that start after you save (the uploader also updates them from the NSRT note after a /reload).</p>
    ${plan.map(P0 => `<label class="soakrow"><span>${esc(P0.label)}</span><input type="text" data-k="${P0.key}" value="${esc(P0.group.join(' '))}" aria-label="${esc(P0.label)} soakers"></label>`).join('')}
    <div class="gact"><button type="button" class="pri" data-a="save">Save</button><span class="gmsg"></span></div>
    <div class="ghist">${mine.length ? 'Saved (newest first): ' + mine.slice(-4).reverse().map(fmt).join(' · ') + '.' : 'Nothing saved yet: these are the NSRT note\'s groups.'}</div></details>`;
  const msg = (t, bad) => { const m = el.querySelector('.gmsg'); m.textContent = t; m.classList.toggle('bad', !!bad); };
  el.querySelector('[data-a="save"]').onclick = async () => {
    const groups = {}, known = new Set(ROSTER.map(r => r[0])), odd = [];
    el.querySelectorAll('input[data-k]').forEach(i => { groups[i.dataset.k] = i.value.split(/[\s,]+/).filter(Boolean); groups[i.dataset.k].forEach(n => { if (!known.has(n)) odd.push(n); }); });
    msg('Saving…');
    try { const r = await fetch(`api/groups/${TEAM.id}/${TIER}/coiled-altar/soaks`, {method: 'PUT', headers: {'Authorization': 'Bearer ' + adminKey(), 'Content-Type': 'application/json'},
        body: JSON.stringify({groups, from: 'now', diffs: [16]})});
      const j = await r.json().catch(() => ({}));
      if (r.status === 401){ msg('The server didn\'t accept the admin key: sign out (title row) and save it again.', true); return; }
      if (!r.ok || !j.ok){ msg(j.error === 'path not allowed' ? 'The server needs updating first (push, then rerun setup).' : (j.error || `Couldn't save (${r.status}).`), true); return; }
      GROUPS.soaks = j.changes.slice().sort((a, b) => a.at - b.at); GROUPS_RAW.soaks = JSON.stringify(j.changes);
      msg('Saved.' + (odd.length ? ` Not on the roster (check the spelling): ${[...new Set(odd)].join(', ')}.` : ''), !!odd.length);
      render();   // the box stays open so the message (and any spelling warning) stays visible
    } catch (e) { msg('Couldn\'t reach the server.', true); } };
}

// ======== Ghosts (Manifestation of Dread): a set = the ghosts from one Dreadmarch ========
// Dreadmarch: Malacrass's cast possesses several players; one that doesn't follow a cast is a Manifestation of Dread reaching the
// player it fixated (Heroic+)
const marches = p => castsOf(p, 'Dreadmarch').map(c => { const m = auras(p, 'Dreadmarch').filter(a => a[1] - c >= -0.5 && a[1] - c <= 4);
