<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nek'zali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="boss.css">
</head>
<body>
<div class="wrap" id="wrap"></div>
<script src="shared.js"></script>
<script>
// The page is drawn by boss.js from this config (see the top of boss.js for what each part means).
const WELL = [208.2, 0.7];   // the Soulcoil Well's middle (fitted 2026-11-02: no Amani ever dies within 10 yd of it)
// Soulcoil Rite fires on its own during Soulcoil Ignition and after each Invoke; any other Rite came from the well being fed.
const planned = p => [...npcAuras(p, 'Soulcoil Ignition').map(a => [a[3] - 0.5, (a[4] != null ? a[4] : p.dur) + 1.5]),
  ...castsOf(p, 'Invoke').map(t => [t - 0.5, t + 7])];
const strayRites = p => pulsesOf(p, 'Soulcoil Rite').filter(x => !inWindows(x[0], planned(p)));
// an Amani that reached the well vanishes there (it never dies): last seen within 8 yd of its middle, not at the end of a wipe
const reached = p => addsOf(p, 'Restless Amani').filter(a => a[4] === 'gone' && a[3] && dist(a[3], WELL) < 8 && a[0] < p.dur - 3);
const waves = p => dedupe(p.spawns.filter(s => s[1] === 'Restless Amani'), 15).map(s => s[0]);
const waveOf = (p, t) => { const w = waves(p); let i = -1; w.forEach((s, k) => { if (s <= t) i = k; }); return i + 1; };
// Essence Rend: the puddle (Latent Cultist) lands where the debuff ended. The target gets time to walk out before a dispel:
// 1.5 s to react plus the walk (7 yd/s) from where they stood when it landed to 35 yd from the well. Dispelled sooner, it's
// the dispeller's mistake ("Dispelled too early") and the puddle doesn't count against the target.
const MID = 35, RUN = 7, REACT = 1.5;
const rends = p => auras(p, '#1287434').map(a => {
  const by = (p.dispels.find(d => d[2] === a[0] && d[3] === 'Essence Rend' && Math.abs(d[0] - (a[2] || 0)) < 0.4) || [])[1] || null;
  const d = dist(a[6], WELL), d0 = dist(a[5], WELL), need = REACT + Math.max(0, MID - (d0 != null ? d0 : MID)) / RUN;
  const after = a[2] != null ? a[2] - a[1] : null, early = !!(by && by !== a[0] && after != null && after < need);
  return {n: a[0], t: a[1], off: a[2], pos: a[6], by, d, after, need, early, mid: d != null && d < MID}; });
const contacts = (p, ability, gap = 2) => { const last = {}, out = [];   // separate touches of a lingering area, not every tick
  hitsOf(p, ability).forEach(h => { if (last[h[1]] == null || h[0] - last[h[1]] > gap) out.push(h); last[h[1]] = h[0]; }); return out; };
const ignitions = p => npcAuras(p, 'Soulcoil Ignition').map(a => {
  const carried = auras(p, 'Ritual Burn').filter(x => x[1] < a[3] - 0.1 && (x[2] == null || x[2] > a[3]));
  return {t: a[3], end: a[4] != null ? a[4] : p.dur, burn: Math.max(0, ...carried.map(x => x[7] || x[3])), burned: carried.length,
    hit: [...new Set(hitsOf(p, 'Anguished Echoes').filter(h => h[0] >= a[3] - 1 && h[0] <= (a[4] != null ? a[4] : p.dur) + 6).map(h => h[1]))]}; });
const stints = p => auras(p, 'Hollowing Strikes').filter(a => isTankIn(p, a[0]) || a[3] > 2);
const TOO_MANY = 8;   // Hollowing Strikes: 5% less healing per stack; swap by 30-40% (Method), 5-6 stacks (Icy Veins)
const CFG = {
  slug: 'nekzali', name: "Nek'zali", enc: ['3470'],
  map: {src: 'img/maps/nekzali.webp', cal: {cx: 208.2, cy: 0.7, ppy: 5.8, rot: 0, center: [299.9, 305.2]}},   // the well's middle is image pixel (299.9, 305.2), radius 48 px; at 5.8 px/yd every Amani death's dot (none within 10.1 yd) clears it
  modules: [
    {id: 'well', title: 'Soulcoil Well',
     one: p => ({head: ['Time', ['What went in', 'l'], ['Details', 'l']], rows: [
       ...reached(p).map(a => ({t: a[0], r: [T(a[0]), B('Amani reached the well'), X(`wave ${waveOf(p, a[0])} · +5 energy and a Soulcoil Rite`, 'det')]})),
       ...auras(p, 'Soulcoiled').map(a => ({t: a[1], r: [T(a[1]), B('Soulcoiled'), X(`${pname(a[0])} was taken into the well: +5 energy and a Soulcoil Rite`, 'det')]})),
       ...castsOf(p, 'Uncoiled Rage').map(t => ({t, r: [T(t), B('Full energy'), X('Uncoiled Rage: +500% damage, immune to taunts', 'det')]}))]
       .sort((a, b) => a.t - b.t).map(x => x.r)}),
     all: list => ({head: [['Wave', 'l'], 'Pulls', 'Amani spawned', 'Reached the well'], rows: (() => {
       const W = []; list.forEach(p => { const w = waves(p); w.forEach((s, i) => { const r = (W[i] ||= {n: 0, s: 0, r: 0}); r.n++;
         r.s += p.spawns.filter(x => x[1] === 'Restless Amani' && x[0] >= s && (i + 1 >= w.length || x[0] < w[i + 1])).length;
         r.r += reached(p).filter(a => waveOf(p, a[0]) === i + 1).length; }); });
       return W.map((r, i) => [`<td class="l">Wave ${i + 1}</td>`, V(r.n), V(r.s), N(r.r)]); })()}),
     foot: list => { const s = list.reduce((a, p) => a + auras(p, 'Soulcoiled').length, 0), e = list.reduce((a, p) => a + castsOf(p, 'Uncoiled Rage').length, 0);
       return `${s} Soulcoiled · ${e} full-energy enrage${e === 1 ? '' : 's'}.`; },
     note: 'Every Restless Amani or Soulcoiled player that reaches the Soulcoil Well gives Nek\'zali 5 energy and sets off a Soulcoil Rite on the raid. Break the Amani\'s Gravebound Advance shield with magic damage and kill them before the water.',
     overlay: {label: 'Amani', get: p => addsOf(p, 'Restless Amani').filter(a => a[3] && (a[4] === 'died' || reached(p).includes(a))).map(a => {   // still walking when a wipe ended: left out
       const got = reached(p).includes(a);
       return {pos: a[3], t: a[0], mark: got ? 'cross' : 'dot', color: got ? '#ff5a4a' : '#9a9396',
         tip: got ? '<b>Restless Amani reached the well</b>' : `<b>Restless Amani killed here</b><br>${p.diff >= 15 ? 'its corpse stays (Vessel of Awakening)' : ''}`}; }),
       key: () => `<span>${keyDot('#9a9396')}Killed (corpse)</span><span>${keyCross('#ff5a4a')}Reached the well</span>`}},

    {id: 'rend', title: 'Essence Rend',
     one: p => ({head: ['Time', ['Puddle from', 'l'], ['Details', 'l']], rows: rends(p).filter(r => r.mid).map(r =>
       [T(r.t), P(r.n), X(`<span class="bad">${Math.round(r.d)} yd from the well</span> · ${r.early
         ? `<span class="bad">dispelled too early by ${pname(r.by)}</span> (after ${r.after.toFixed(1)} s; needed ${r.need.toFixed(1)} s to get out)`
         : r.by ? `dispelled by ${pname(r.by)} after ${r.after.toFixed(1)} s` : 'ran out'}`, 'det')])}),
     all: list => perPlayer(list, [
       {h: 'Puddle in the middle', get: p => rends(p).filter(r => r.mid && !r.early).map(r => ({n: r.n, t: r.off}))},
       {h: 'Dispelled too early', get: p => rends(p).filter(r => r.mid && r.early).map(r => ({n: r.by, t: r.off}))},
       {h: 'Stood in a puddle', get: p => contacts(p, 'Latent Cultist').map(h => ({n: h[1], t: h[0]}))}]),
     foot: list => { const s = {}; list.forEach(p => contacts(p, 'Latent Cultist').forEach(h => inc(s, h[1])));
       const top = Object.entries(s).sort((a, b) => b[1] - a[1]).slice(0, 6); return list.length === 1 && top.length ? `Stood in a puddle: ${top.map(([n, c]) => `${pname(n)} ${c}`).join(', ')}.` : ''; },
     note: 'The target runs to the edge before being dispelled: the Latent Cultist puddle stays for the rest of the fight (and moves on Invoke). Middle = under 35 yd from the well. Dispelled too early = before the target could walk out (1.5 s plus the walk at 7 yd/s); that puddle counts against the dispeller, not the target.',
     overlay: {label: 'Essence Rend puddles', get: p => rends(p).filter(r => r.pos).map(r => ({pos: r.pos, t: r.off, n: r.n, color: !r.mid ? '#d8d2cf' : r.early ? '#f2a33a' : '#ff5a4a',
       tip: `<b style="color:${color(r.n)}">${esc(r.n)}</b>'s puddle${r.mid ? ' (middle)' : ''}<br>${r.early ? `dispelled too early by ${esc(r.by)} (${r.after.toFixed(1)} s, needed ${r.need.toFixed(1)} s)` : r.by ? `dispelled by ${esc(r.by)} after ${r.after.toFixed(1)} s` : 'ran out'}`})),
       key: () => `<span>${keyDot('#d8d2cf')}At the edge</span><span>${keyDot('#ff5a4a')}In the middle</span><span>${keyDot('#f2a33a')}In the middle: dispelled too early</span>`}},

    {id: 'ign', title: 'Soulcoil Ignition',
     one: p => ({head: ['Time', 'Ritual Burn carried in', ['Hit by Anguished Echoes', 'l']], rows: ignitions(p).filter(g => g.burn || g.hit.length).map(g =>
       [T(g.t), p.diff >= 15 ? N(g.burn ? `${g.burn} on ${g.burned}` : 0) : '<td class="num dim">–</td>', PS(g.hit)])}),
     all: list => perPlayer(list, [{h: 'Hit by Anguished Echoes', get: p => ignitions(p).flatMap(g => g.hit.map(n => ({n, t: g.t})))}]),
     foot: list => { const n = list.flatMap(ignitions).filter(g => g.burn).length; return n ? `<b style="color:var(--crit)">${n} Ignition${n === 1 ? '' : 's'} started with Ritual Burn on the raid.</b>` : ''; },
     note: 'Ritual Burn (Heroic, Mythic) has to be gone before Soulcoil Ignition starts; it\'s left over from extra Rites. Dodge the Anguished Echoes that fall from the well.'},

    {id: 'hollow', title: 'Hollowing Strikes',
     one: p => ({head: [['Tank', 'l'], 'From', 'To', 'Top stack'], rows: stints(p).filter(a => a[3] > TOO_MANY).map(a => [P(a[0]), T(a[1]), T(a[2] != null ? a[2] : p.dur), N(a[3], a[3] > TOO_MANY ? 'bad' : '')])}),
     all: list => perPlayer(list, [{h: `Held past ${TOO_MANY} stacks`, get: p => stints(p).filter(a => a[3] > TOO_MANY).map(a => ({n: a[0], t: a[1]}))}], ['Tank', 'l']),
     note: `Each stack takes 5% off the tank's healing. Swap by 30-40% (Method) or 5-6 stacks (Icy Veins); over ${TOO_MANY} shows in red.`},

    {id: 'echo', title: 'Echoes of Jawae (intermission)',
     one: p => ({head: ['Time', ['What', 'l'], ['Details', 'l']], rows: [
       ...dedupe(hitsOf(p, 'Soul Transfer'), 3).map(h0 => { const ns = [...new Set(hitsOf(p, 'Soul Transfer').filter(h => Math.abs(h[0] - h0[0]) < 3).map(h => h[1]))];
         return {t: h0[0], r: [T(h0[0]), B('In the Soul Transfer beam'), PS(ns)]}; }),
       ...dedupe(npcAuras(p, 'Vessel of Awakening'), 1, a => a[3]).map(a => ({t: a[3], r: [T(a[3]), B('Corpse rose again'), X(`${npcAuras(p, 'Vessel of Awakening').filter(b => Math.abs(b[3] - a[3]) < 1).length} empowered Amani from corpses left on the floor`, 'det')]})),
]
       .sort((a, b) => a.t - b.t).map(x => x.r)}),
     all: list => perPlayer(list, [{h: 'In the Soul Transfer beam', get: p => dedupe(hitsOf(p, 'Soul Transfer').map(h => [h[0], h[1]]), 0).map(h => ({n: h[1], t: h[0]}))}]),
     foot: list => { const n = list.reduce((a, p) => a + dedupe(npcAuras(p, 'Vessel of Awakening'), 1, a => a[3]).length, 0); return list.length > 1 && n ? `<b style="color:var(--crit)">Corpses rose again ${n} time${n === 1 ? '' : 's'}.</b>` : ''; },
     note: 'Leave the Soul Transfer beam before it ends. On Heroic and Mythic, corpses of killed Amani come back as empowered Amani: burn them with the Hungering Pyre soak and Slithering Flames.',
     overlay: {label: 'Corpses that rose', diffs: '15,16', get: p => npcAuras(p, 'Vessel of Awakening').filter(a => a[5]).map(a => ({pos: a[5], t: a[3], mark: 'cross', tip: '<b>Corpse rose again</b><br>an Amani corpse left on the floor'})),
       key: () => `<span>${keyCross('#ff5a4a')}Corpse that rose again</span>`}},

    {id: 'depths', title: 'Grasping Depths', diffs: '16',
     one: p => kickOne(p, ["Soulcoiler's Curse"]), all: list => kickAll(list, ["Soulcoiler's Curse"]),
     foot: list => { const sw = {}; list.forEach(p => auras(p, 'Swirling Spirit').forEach(a => { sw[a[0]] = Math.max(sw[a[0]] || 0, a[3]); }));
       const top = Object.entries(sw).filter(([, v]) => v >= 3).sort((a, b) => b[1] - a[1]); return kickFoot(list, ["Soulcoiler's Curse"]) + (top.length ? ` Swirling Spirit 3+ stacks: ${top.map(([n, v]) => `${pname(n)} ${v}`).join(', ')}.` : ''); },
     note: "Kick every Soulcoiler's Curse from the Drowned Echo: a missed one throws the well team out, Soulcoiled. Don't touch the Swirling Spirits."},

    {id: 'invoke', title: 'Invoke', diffs: '16',
     one: p => perPlayer([p], [{h: 'Silenced', get: q => auras(q, 'Invoke').map(a => ({n: a[0], t: a[1]}))}]),
     all: list => perPlayer(list, [{h: 'Silenced', get: q => auras(q, 'Invoke').map(a => ({n: a[0], t: a[1]}))}]),
     note: 'Stop casting before Invoke goes out in Phase 2: it silences anyone casting for 3 s.'},
  ],
  abilities: {"Soulcoiler's Curse": 1300238, 'Soulcoiled': 1290361, 'Invoke': 1299673, 'Soulcoil Rite': 1284033, 'Soulcoil Ignition': 1285681,
    'Restless Amani': 1289919, 'Gravebound Advance': 1287533, 'Soulcoil Well': 1284032, 'Uncoiled Rage': 1284034, 'Latent Cultist': 1287198,
    'Anguished Echoes': 1294846, 'Soul Transfer': 1292248, 'Swirling Spirit': 1300239, 'Essence Rend': 1287426, 'Ritual Burn': 1297624,
    'Ritual of Awakening': 1289683, 'Grasping Depths': 1293212, 'Possession Barrage': 1284103, 'Hollowing Strikes': 1284110,
    'Hungering Pyre': 1289855, 'Slithering Flame': 1294933, 'Vessel of Awakening': 1295263, 'Echoes of Jawae': 1292248, 'Echo of Jawae': 1292248,
    'Drowned Echo': 1293212, 'Deadly Venom': 1297338},
  how: "Built from the Encounter Journal, Method's Heroic and Mythic guides and Icy Veins, and checked against Taylor's logs (Sep-Oct 2026: 10 Mythic and 13 Heroic pulls); not yet checked on a live raid night. An Amani that reached the well is one that was last seen in it and never died (each one lines up with an extra Soulcoil Rite in the logs). Puddles: where the Essence Rend debuff ended. The room image is from raidstrats.gg, centred on the Soulcoil Well (fitted to where Amani die: never within 10 yd of its middle); north is up.",
};
</script>
<script src="boss.js"></script>
</body>
</html>
